</head>
    <body>

      <div id="product-container" class="product-grid"></div>
       <div id="mobileMenu" class="mobile-menu-overlay" style="display: none;">
    <div class="menu-header">
      <span class="close-btn" onclick="toggleMenu()">&times;</span>
    </div>
    <!-- Daftar Menu Navigasi -->
    <ul class="menu-list">
      <li class="menu-item">

      </li>

      <li class="menu-item">
        <a href="#" class="menu-link toggle-submenu">

        </a>
       
        <ul class="submenu">
          <li><a href="#">Boho Collection</a></li>
          <li><a href="#">Minimalist</a></li>
        </ul>
      </li>

      <li class="menu-item">
        <a href="#" class="menu-link">NEW</a>
      </li>

      <li class="menu-item">
        <a href="#" class="menu-link">SALE</a>
      </li>
    </ul>

    <!-- Kontak & Telepon -->
    <div class="contact-info">
      <div><strong>Contact us</strong></div>
      <div style="text-align: right;">
        <strong>Tel (+62)</strong>
        <span>81353885155</span>
      </div>
    <!-- Login & Bahasa -->
    <a href="#" class="login-link">Log in</a>
    <div class="language-selector">English &#x25BE;</div>

    <!-- Media Sosial -->
    <div class="social-links">
      <a href="#" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" class="social-btn"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" class="social-btn"><i class="fa-brands fa-pinterest-p"></i></a>
    </div>
  </div>



<!-- Header Utama -->
  <header>
    <button onclick="toggleMenu()" style="background:none; border:none; font-size:24px; color:#d4af37; cursor:pointer;">
      &#9776;
    </button>

    <div class="logo-container">
      <span class="brand-name">mutumanikam</span>
    </div>
  </header>

  <!-- Hero Section & konten web lainnya -->


  <!-- Script JavaScript Buka-Tutup Menu -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.style.display = (menu.style.display === "none" || menu.style.display === "") ? "flex" : "none";
    }
<script>
    document.querySelectorAll('.toggle-submenu').forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        const submenu = this.nextElementSibling;
        if (submenu) {
          submenu.style.display = (submenu.style.display === 'block') ? 'none' : 'block';
        }
      });
    });
  </script>
      <!-- Wadah Produk -->
    <div id="product-container" class="product-grid"></div>

    <!-- Panggil Library Firebase terlebih dahulu -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Kode Logika Firebase -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBNlsnzbMHKq9gKWe-EvYgrzwohxXLAOs",
        authDomain: "mutumanikam-store.firebaseapp.com",
        projectId: "mutumanikam-store",
        storageBucket: "mutumanikam-store.firebasestorage.app",
        messagingSenderId: "28963833581",
        appId: "1:28963833581:web:1a8001fec139a7ace1abe4",
        measurementId: "G-08EDBKUFBU"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      function loadProducts() {
        db.collection("Products").get().then((querySnapshot) => {
          let productHTML = "";
          querySnapshot.forEach((doc) => {
            const product = doc.data();
            productHTML += `
              <div class="product-card">
                <img src="${product.image}" alt="${product.name}">
                <h3>${product.name}</h3>
                <p class="category">${product.category}</p>
                <p class="price">Rp ${Number(product.price).toLocaleString('id-ID')}</p>
              </div>
            `;
          });
          document.getElementById("product-container").innerHTML = productHTML;
        });
      }

      loadProducts();
    </script>
  </body>
</html>
  </script>

</body>
