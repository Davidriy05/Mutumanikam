<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mutumanikam</title>

<style>
body {
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial;
}

/* HEADER */
header {
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px;
  background:#161616;
  border-bottom:1px solid #222;
}

.brand {
  color:#d4af37;
  font-weight:bold;
  cursor:pointer;
}

/* HERO */
#home img, #home video {
  width:100%;
  object-fit:cover;
}
#home img { height:60vh; }
#home video { height:40vh; }

.cta {
  text-align:center;
  margin:20px;
}

.cta button {
  background:#d4af37;
  color:#111;
  border:none;
  padding:12px 20px;
  font-weight:bold;
  cursor:pointer;
}

/* PRODUCT */
.product-grid {
  display:none;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
  padding:20px;
}

.product-card {
  background:#222;
  padding:15px;
  border:1px solid #333;
  text-align:center;
}

.product-card img {
  width:100%;
  height:200px;
  object-fit:cover;
}

.buy-btn {
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#d4af37;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.qty {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.qty button {
  width:30px;
}

/* MODAL */
#checkoutModal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

.modal-box {
  background:#222;
  padding:20px;
  width:90%;
  max-width:400px;
}

/* SIDEBAR */
#overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
}

#mobileMenu {
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:#161616;
  padding:20px;
  transition:0.3s;
  z-index:1000;
}

#mobileMenu.active {
  left:0;
}

#overlay.active {
  display:block;
}

.menu-item {
  padding:10px;
  border-bottom:1px solid #333;
  cursor:pointer;
}

.submenu {
  display:none;
  padding-left:15px;
}

.menu-item.active .submenu {
  display:block;
}

</style>
</head>

<body>

<header>
  <span onclick="toggleMenu()" style="cursor:pointer;font-size:22px;">☰</span>
  <span class="brand" onclick="goHome()">Mutumanikam</span>
</header>

<!-- SIDEBAR -->
<div id="overlay" onclick="toggleMenu()"></div>

<div id="mobileMenu">
  <div class="menu-item" onclick="toggleSub(this)">
    SHOP
    <ul class="submenu">
      <li onclick="filterCategory('Necklace')">Necklace</li>
      <li onclick="filterCategory('Bracelet')">Bracelet</li>
      <li onclick="filterCategory('Purse')">Purse</li>
      <li onclick="filterCategory('Belt')">Belt</li>
    </ul>
  </div>

  <div class="menu-item" onclick="filterCategory(null)">ALL PRODUCTS</div>
</div>

<!-- HOME -->
<section id="home">
  <img src="https://via.placeholder.com/1200x600?text=Mutumanikam">
  <video autoplay muted loop>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4">
  </video>

  <div class="cta">
    <button onclick="openShop()">Shop Now</button>
  </div>
</section>

<!-- PRODUCT -->
<div id="products" class="product-grid"></div>

<!-- CHECKOUT -->
<div id="checkoutModal">
  <div class="modal-box">
    <h3>Checkout</h3>

    <input id="nama" placeholder="Nama" style="width:100%;margin-top:10px;">
    <textarea id="alamat" placeholder="Alamat" style="width:100%;margin-top:10px;"></textarea>

    <p id="produk"></p>
    <p id="total"></p>

    <button onclick="kirimWA()">Kirim WA</button>
    <button onclick="closeModal()">Batal</button>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "APIKEY",
  authDomain: "mutumanikam-store.firebaseapp.com",
  projectId: "mutumanikam-store"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* NAV */
function openShop(){
  document.getElementById("home").style.display="none";
  document.getElementById("products").style.display="grid";
  loadProducts();
}

function goHome(){
  document.getElementById("home").style.display="block";
  document.getElementById("products").style.display="none";
}

/* SIDEBAR */
function toggleMenu(){
  document.getElementById("mobileMenu").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
}

function toggleSub(el){
  el.classList.toggle("active");
}

function filterCategory(cat){
  document.getElementById("home").style.display="none";
  document.getElementById("products").style.display="grid";
  toggleMenu();
  loadProducts(cat);
}

/* LOAD PRODUCTS */
function loadProducts(category=null){
  let el = document.getElementById("products");
  el.innerHTML="Loading...";

  let query = db.collection("Products");

  if(category){
    query = query.where("category","==",category);
  }

  query.get().then(snap=>{
    if(snap.empty){
      el.innerHTML="Produk belum tersedia";
      return;
    }

    let html="";

    snap.forEach(doc=>{
      let p = doc.data();

      html += `
      <div class="product-card" data-name="${p.name}" data-price="${p.price}">
        <img src="${p.image || 'https://via.placeholder.com/200'}">
        <h3>${p.name}</h3>
        <p>Rp ${p.price}</p>

        <div class="qty">
          <button onclick="qty(this,-1)">-</button>
          <span>1</span>
          <button onclick="qty(this,1)">+</button>
        </div>

        <button class="buy-btn" onclick="checkout(this)">Beli WA</button>
      </div>`;
    });

    el.innerHTML = html;
  });
}

/* QTY */
function qty(btn,change){
  let s = btn.parentElement.querySelector("span");
  let v = parseInt(s.innerText);
  v += change;
  if(v<1) v=1;
  s.innerText = v;
}

/* CHECKOUT */
function checkout(btn){
  let card = btn.closest(".product-card");

  let name = card.dataset.name;
  let price = Number(card.dataset.price);
  let qty = parseInt(card.querySelector("span").innerText);

  let total = price * qty;

  let modal = document.getElementById("checkoutModal");
  modal.style.display="flex";

  modal.dataset.name = name;
  modal.dataset.price = price;
  modal.dataset.qty = qty;

  document.getElementById("produk").innerText = name + " ("+qty+")";
  document.getElementById("total").innerText = "Rp " + total;
}

function closeModal(){
  document.getElementById("checkoutModal").style.display="none";
}

/* WA */
function kirimWA(){
  let nama = document.getElementById("nama").value;
  let alamat = document.getElementById("alamat").value;

  let modal = document.getElementById("checkoutModal");

  let name = modal.dataset.name;
  let price = Number(modal.dataset.price);
  let qty = Number(modal.dataset.qty);
  let total = price * qty;

  let pesan = `Halo Admin Mutumanikam 👋
Produk: ${name}
Jumlah: ${qty}
Total: Rp ${total}

Nama: ${nama}
Alamat: ${alamat}`;

  let url = "https://wa.me/6281353885122?text=" + encodeURIComponent(pesan);
  window.open(url,"_blank");
}
</script>

</body>
</html>
