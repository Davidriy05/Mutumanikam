<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mutumanikam</title>

  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    /* Grid Tampilan Produk */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .product-card {
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .product-card img {
      max-width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer; /* Indikator bahwa gambar bisa diklik */
      transition: transform 0.2s;
    }
    .product-card img:hover {
      transform: scale(1.03); /* Efek zoom tipis saat kursor di atas gambar */
    }
    .product-card h3 {
      margin: 10px 0 5px;
      color: #d4af37;
    }
    .product-card .category {
      font-size: 0.85em;
      color: #888;
    }
    .product-card .price {
      font-weight: bold;
      color: #fff;
    }

    /* MODAL POP-UP GAMBAR */
    .image-modal {
      display: none; 
      position: fixed; 
      z-index: 1000; 
      padding-top: 50px; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      background-color: rgba(0, 0, 0, 0.85); /* Latar belakang gelap transparan */
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }
    .close-modal {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-modal:hover {
      color: #d4af37;
    }
  </style>
</head>
<body>

  <!-- Header Utama -->
  <header style="padding: 15px; display: flex; align-items: center; gap: 15px;">
    <button onclick="toggleMenu()" style="background:none; border:none; font-size:24px; color:#d4af37; cursor:pointer;">
      &#9776;
    </button>
    <div class="logo-container">
      <span class="brand-name" style="font-size: 20px; font-weight: bold; color: #d4af37;">mutumanikam</span>
    </div>
  </header>

  <!-- Mobile Menu Overlay -->
  <div id="mobileMenu" class="mobile-menu-overlay" style="display: none; flex-direction: column; padding: 20px; background: #222;">
    <div class="menu-header">
      <span class="close-btn" onclick="toggleMenu()" style="cursor: pointer; font-size: 24px;">&times;</span>
    </div>
    <ul class="menu-list" style="list-style: none; padding: 0;">
      <li class="menu-item">
        <a href="#" class="menu-link toggle-submenu" style="color: #fff; text-decoration: none;">SHOP</a>
        <ul class="submenu" style="display: none;">
          <li><a href="#" class="category-filter" data-category="Necklace" style="color: #ccc;">Necklace</a></li>
          <li><a href="#" class="category-filter" data-category="Bracelet" style="color: #ccc;">Bracelet</a></li>
          <li><a href="#" class="category-filter" data-category="Purse" style="color: #ccc;">Purse</a></li>
          <li><a href="#" class="category-filter" data-category="Belt" style="color: #ccc;">Belt</a></li>
        </ul>
      </li>
    </ul>
  </div>

  <!-- Wadah Produk Firestore -->
  <div id="product-container" class="product-grid"></div>

  <!-- POP-UP MODAL UNTUK GAMBAR MESAR -->
  <div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="imgFull">
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.style.display = (menu.style.display === "none" || menu.style.display === "") ? "flex" : "none";
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBNlsnzbMHKq9gKWe-EvYgrzwohxXLAOs",
      authDomain: "mutumanikam-store.firebaseapp.com",
      projectId: "mutumanikam-store",
      storageBucket: "mutumanikam-store.firebasestorage.app",
      messagingSenderId: "28963833581",
      appId: "1:28963833581:web:1a8001fec139a7ace1abe4",
      measurementId: "G-08EDBKUFBU"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function loadProducts(categoryFilter = null) {
      let query = db.collection("Products");

      if (categoryFilter) {
        query = query.where("category", "==", categoryFilter);
      }

      query.get().then((querySnapshot) => {
        let productHTML = "";
        if (querySnapshot.empty) {
          productHTML = "<p style='padding: 20px;'>Tidak ada produk untuk kategori ini.</p>";
        } else {
          querySnapshot.forEach((doc) => {
            const product = doc.data();
            productHTML += `
              <div class="product-card">
                <img src="${product.image}" alt="${product.name}" onclick="openImageModal('${product.image}')">
                <h3>${product.name}</h3>
                <p class="category">${product.category}</p>
                <p class="price">Rp ${Number(product.price).toLocaleString('id-ID')}</p>
              </div>
            `;
          });
        }
        document.getElementById("product-container").innerHTML = productHTML;
      }).catch((error) => {
        console.error("Gagal memuat produk:", error);
      });
    }

    // Fungsi untuk membuka gambar membesar
    function openImageModal(imageSrc) {
      const modal = document.getElementById("imageModal");
      const imgFull = document.getElementById("imgFull");
      modal.style.display = "flex";
      imgFull.src = imageSrc;
    }

    // Fungsi untuk menutup modal
    function closeImageModal() {
      document.getElementById("imageModal").style.display = "none";
    }

    loadProducts();

    document.querySelectorAll('.category-filter').forEach(button => {
      button.addEventListener('click', function(e) {
        e.preventDefault();
        const selectedCategory = this.getAttribute('data-category');
        loadProducts(selectedCategory);
        toggleMenu();
      });
    });
  </script>
</body>
</html>
