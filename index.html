<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mutumanikam</title>

  <style>
    /* Baseline Styles */
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      letter-spacing:0.5px;
    }

    /* Grid Tampilan Produk */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
      transition: 0.3s;
    }
.product-card {
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      transition: 0.3s;
      /* Animasi fadeUp dimasukkan ke dalam .product-card */
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease forwards;
    } /* Tag penutup .product-card */

    /* Efek menyala lembut untuk logo atau tombol */
    .brand-name {
      transition: text-shadow 0.3s ease;
    }

    .brand-name:hover {
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: #d4af37;
    }

    /* Staggered delay untuk tiap kartu */
    .product-card:nth-child(1) { animation-delay: 0.1s; }
    .product-card:nth-child(2) { animation-delay: 0.2s; }
    .product-card:nth-child(3) { animation-delay: 0.3s; }
    .product-card:nth-child(4) { animation-delay: 0.4s; }
    .product-card:nth-child(5) { animation-delay: 0.5s; }

    /* Keyframes animasi fadeUp */
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .product-card:hover {
      transform: translateY(-5px);
      border-color: #d4af37;}
    .product-card img {
      max-width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .product-card img:hover {
      transform: scale(1.05);
    }

    .qty-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .qty-box button {
      width: 30px;
      height: 30px;
      border: none;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    .qty-box span {
      min-width: 20px;
      text-align: center;
      font-weight: bold;
    }

    /* Kode .product-card h3 kamu akan tergeser ke bawah setelahnya */
    .product-card h3 {
      margin: 10px 0 5px;
      color: #d4af37;
    }
    .product-card h3 {
      margin: 10px 0 5px;
      color: #d4af37;
    }
    .product-card .category {
      font-size: 0.85em;
      color: #888;
    }
    .product-card .price {
      font-weight: bold;
      color: #fff;
    }

    /* Overlay Sidebar */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: 0.4s;
      z-index: 998;
    }
    #overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Sidebar Drawer */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 260px;
      height: 100%;
      background: #111;
      padding: 20px;
      box-sizing: border-box;
      transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 999;
    }
    .sidebar.active {
      transform: translateX(280px);
    }

    /* Item & Animasi Menu */
    .menu-section {
      opacity: 0;
      transform: translateX(-20px);
      transition: 0.4s;
      border-bottom: 1px solid #333;
      padding: 15px 0;
    }
    .sidebar.active .menu-section {
      opacity: 1;
      transform: translateX(0);
    }
    .sidebar.active .menu-section:nth-child(1) { transition-delay: .1s; }
    .sidebar.active .menu-section:nth-child(2) { transition-delay: .2s; }
    .sidebar.active .menu-section:nth-child(3) { transition-delay: .3s; }
    .sidebar.active .menu-section:nth-child(4) { transition-delay: .4s; }

    .menu-title {
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      letter-spacing: 2px;
      font-weight: bold;
    }
.menu-title span{ transition: 0.3s;
}

.menu-section.active .menu-title span {
  transform: rotate(180deg);
}
    /* Submenu Accordion */
    .submenu {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.3s ease;
    }
    .menu-section.active .submenu {
      max-height: 200px;
      opacity: 1;
      margin-top: 10px;
    }
    .submenu p {
      margin: 10px 0;
      color: #aaa;
      cursor: pointer;
      transition: 0.3s;
    }
    .submenu p:hover {
      color: #d4af37;
      transform: translateX(6px);
    }

    /* Modal Pop-Up Gambar */
    .image-modal {
      display: none; 
      position: fixed; 
      z-index: 1000; 
      padding-top: 50px; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }
    .close-modal {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-modal:hover {
      color: #d4af37;
    }
  </style>
</head>
<body>

  <!-- Header Utama -->
  <header style="padding: 15px; display: flex; align-items: center; gap: 15px;">
    <button onclick="toggleMenu()" style="background:none; border:none; font-size:24px; color:#d4af37; cursor:pointer;">
      &#9776;
    </button>
  <div class="logo-container">
  <span class="brand-name" style="font-size: 20px; font-weight: bold; color: #d4af37;">Mutumanikam</span>
</div>
  </header>

  <!-- Overlay -->
  <div id="overlay" onclick="toggleMenu()"></div>

  <!-- Sidebar Navigasi -->
  <div id="mobileMenu" class="sidebar">
    <div class="menu-section">
      <div class="menu-title" onclick="toggleSub(this)">
        SHOP <span>⌄</span>
      </div>
      <div class="submenu">
        <p onclick="filterCategory('Necklace')">Necklace</p>
        <p onclick="filterCategory('Bracelet')">Bracelet</p>
        <p onclick="filterCategory('Purse')">Purse</p>
        <p onclick="filterCategory('Belt')">Belt</p>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-title" onclick="toggleSub(this)">
        STYLE <span>⌄</span>
      </div>
      <div class="submenu">
        <p>Bohemian</p>
        <p>Resortwear</p>
        <p>Casual</p>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-title">NEW</div>
    </div>

    <div class="menu-section">
      <div class="menu-title">SALE</div>
    </div>
  </div>

  <!-- Wadah Produk Firestore -->
  <div id="product-container" class="product-grid"></div>

  <!-- Modal Pop-Up Gambar -->
  <div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="imgFull" alt="Product Preview">
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    // Konfigurasi Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBNlsnzbMHKq9gKWe-EvYgrzwohxXLAOs",
      authDomain: "mutumanikam-store.firebaseapp.com",
      projectId: "mutumanikam-store",
      storageBucket: "mutumanikam-store.firebasestorage.app",
      messagingSenderId: "28963833581",
      appId: "1:28963833581:web:1a8001fec139a7ace1abe4",
      measurementId: "G-08EDBKUFBU"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Fungsi Navigasi UI
  function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      const overlay = document.getElementById("overlay");

      menu.classList.toggle("active");
      overlay.classList.toggle("active");

      // Tambahan agar layar belakang tidak bisa di-scroll saat menu buka
      document.body.style.overflow = menu.classList.contains("active") ? "hidden" : "auto";
    }
    function toggleSub(el) {
      const parent = el.parentElement;

      // Tutup submenu lain yang sedang terbuka
      document.querySelectorAll(".menu-section").forEach(item => {
        if (item !== parent) item.classList.remove("active");
      });

      parent.classList.toggle("active");
    }

    function filterCategory(category) {
      loadProducts(category);
      toggleMenu();
    }

// Fungsi Fetch Firestore
function loadProducts(categoryFilter = null) {
      let query = db.collection("Products");

      if (categoryFilter) {
        query = query.where("category", "==", categoryFilter);
      }

      query.get().then((querySnapshot) => {
        let productHTML = "";
        if (querySnapshot.empty) {
          productHTML = "<p style='padding: 20px;'>Tidak ada produk untuk kategori ini.</p>";
        } else {
          querySnapshot.forEach((doc) => {
            const product = doc.data();
            
            // --- GANTI TEMPLATE LAMA DENGAN SKRIP BARU INI ---
            productHTML += `
              <div class="product-card">
                <img src="${product.image}" alt="${product.name}" onclick="openImageModal('${product.image}')">

                <h3>${product.name}</h3>
                <p class="category">${product.category}</p>
                <p class="price">Rp ${Number(product.price).toLocaleString('id-ID')}</p>

                <!-- QTY CONTROL -->
                <div class="qty-box">
                  <button onclick="changeQty(this, -1)">-</button>
                  <span class="qty">1</span>
                  <button onclick="changeQty(this, 1)">+</button>
                </div>

                <!-- BUTTON WA -->
                <button class="buy-btn" onclick="orderWA(this, '${product.name}', ${product.price})">
                  Beli via WhatsApp
                </button>
              </div>
            `;
          });
        }

        document.getElementById("product-container").style.opacity = 0;
        setTimeout(() => {
          document.getElementById("product-container").innerHTML = productHTML;
          document.getElementById("product-container").style.opacity = 1;
        }, 200);

      }).catch((error) => {
        console.error("Gagal memuat produk:", error);
      });
    }
        
        // Efek transisi fade-in saat render produk
        document.getElementById("product-container").style.opacity = 0;
        setTimeout(() => {
          document.getElementById("product-container").innerHTML = productHTML;
          document.getElementById("product-container").style.opacity = 1;
        }, 200);

      }).catch((error) => {
        console.error("Gagal memuat produk:", error);
      });
    }

    // Modal Gambar Functions
    function openImageModal(imageSrc) {
      const modal = document.getElementById("imageModal");
      const imgFull = document.getElementById("imgFull");
      modal.style.display = "flex";
      imgFull.src = imageSrc;
    }

    function closeImageModal() {
      document.getElementById("imageModal").style.display = "none";
    }
    // Fungsi untuk mengubah jumlah kuantitas (QTY)
  function changeQty(btn, change) {
      const qtyElement = btn.parentElement.querySelector(".qty");
      let qty = parseInt(qtyElement.innerText);

      qty += change;

      if (qty < 1) qty = 1;

      qtyElement.innerText = qty;
    }

    // Fungsi untuk mengarahkan ke WhatsApp
 function orderWA(button, name, price) {
      let phone = "6281353885122";

      // ambil qty dari card yang sama
      let card = button.closest(".product-card");
      let qty = parseInt(card.querySelector(".qty").innerText);

      // --- HITUNG TOTAL HARGA DI SINI ---
      let totalPrice = Number(price) * qty;

      let message = `Halo Admin Mutumanikam 👋

Saya ingin memesan:

🛍️ Produk : ${name}
💰 Harga  : Rp ${Number(price).toLocaleString('id-ID')}
📦 Jumlah : ${qty} pcs
💵 Total  : Rp ${totalPrice.toLocaleString('id-ID')}

Mohon info stok & total pembayaran ya. Terima kasih 🙏`;

      let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

      window.open(url, "_blank");
    }

    // Inisialisasi awal saat halaman dimuat
    loadProducts();
  </script>
</body>
</html>
