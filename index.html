<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mutumanikam</title>

  <style>
    /* Baseline Styles */
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      letter-spacing: 0.5px;
    }

    /* Grid Tampilan Produk */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
      transition: 0.3s;
    }

    .product-card {
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      transition: 0.3s;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease forwards;
    }

    .brand-name {
      transition: text-shadow 0.3s ease;
    }

    .brand-name:hover {
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: #d4af37;
    }

    /* Staggered delay untuk tiap kartu */
    .product-card:nth-child(1) { animation-delay: 0.1s; }
    .product-card:nth-child(2) { animation-delay: 0.2s; }
    .product-card:nth-child(3) { animation-delay: 0.3s; }
    .product-card:nth-child(4) { animation-delay: 0.4s; }
    .product-card:nth-child(5) { animation-delay: 0.5s; }

    /* Keyframes animasi fadeUp */
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .product-card img {
      max-width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .product-card img:hover {
      transform: scale(1.05);
    }

    .qty-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .qty-box button {
      width: 30px;
      height: 30px;
      border: none;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    .qty-box span {
      min-width: 20px;
      text-align: center;
      font-weight: bold;
    }

    .product-card h3 {
      margin: 10px 0 5px;
      color: #d4af37;
    }

    .product-card .category {
      font-size: 0.85em;
      color: #888;
    }

    .product-card .price {
      font-weight: bold;
      color: #fff;
    }

    .buy-btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background: #f3e5ab;
    }

    /* Overlay Sidebar */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: 0.4s;
      z-index: 998;
    }

    #overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Sidebar Drawer */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 260px;
      height: 100%;
      background: #111;
      padding: 20px;
      box-sizing: border-box;
      transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 999;
    }

    .sidebar.active {
      transform: translateX(280px);
    }

    /* Item & Animasi Menu */
    .menu-section {
      opacity: 0;
      transform: translateX(-20px);
      transition: 0.4s;
      border-bottom: 1px solid #333;
      padding: 15px 0;
    }

    .sidebar.active .menu-section {
      opacity: 1;
      transform: translateX(0);
    }

    .sidebar.active .menu-section:nth-child(1) { transition-delay: .1s; }
    .sidebar.active .menu-section:nth-child(2) { transition-delay: .2s; }
    .sidebar.active .menu-section:nth-child(3) { transition-delay: .3s; }
    .sidebar.active .menu-section:nth-child(4) { transition-delay: .4s; }

    .menu-title {
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .menu-title span { 
      transition: 0.3s; 
    }

    .menu-section.active .menu-title span {
      transform: rotate(180deg);
    }

    /* Submenu Accordion */
    .submenu {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.3s ease;
    }

    .menu-section.active .submenu {
      max-height: 200px;
      opacity: 1;
      margin-top: 10px;
    }

    .submenu p {
      margin: 10px 0;
      color: #aaa;
      cursor: pointer;
      transition: 0.3s;
    }

    .submenu p:hover {
      color: #d4af37;
      transform: translateX(6px);
    }

    /* Modal Pop-Up Gambar dengan Zoom */
    .image-modal {
      display: none; 
      position: fixed; 
      z-index: 1000; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-direction: column;
    }

    .modal-content-wrapper {
      position: relative;
      max-width: 90%;
      max-height: 75vh;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      transition: transform 0.3s ease;
      cursor: zoom-in;
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    .close-modal:hover {
      color: #d4af37;
    }

    /* Kontrol Zoom Tambahan */
    .zoom-controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      z-index: 1001;
    }

    .zoom-btn {
      background: #222;
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }

    .zoom-btn:hover {
      background: #d4af37;
      color: #111;
    }
  </style>
</head>
<body>

  <!-- Header Utama -->
  <header style="padding: 15px; display: flex; align-items: center; gap: 15px;">
    <button onclick="toggleMenu()" style="background:none; border:none; font-size:24px; color:#d4af37; cursor:pointer;">
      &#9776;
    </button>
    <div class="logo-container">
      <span class="brand-name" style="font-size: 20px; font-weight: bold; color: #d4af37; cursor:pointer;" onclick="loadProducts()">Mutumanikam</span>
    </div>
  </header>

  <!-- Overlay -->
  <div id="overlay" onclick="toggleMenu()"></div>

  <!-- Sidebar Navigasi -->
  <div id="mobileMenu" class="sidebar">
    <div class="menu-section">
      <div class="menu-title" onclick="toggleSub(this)">
        SHOP <span>⌄</span>
      </div>
      <div class="submenu">
        <p onclick="filterCategory('Necklace')">Necklace</p>
        <p onclick="filterCategory('Bracelet')">Bracelet</p>
        <p onclick="filterCategory('Purse')">Purse</p>
        <p onclick="filterCategory('Belt')">Belt</p>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-title" onclick="toggleSub(this)">
        STYLE <span>⌄</span>
      </div>
      <div class="submenu">
        <p>Bohemian</p>
        <p>Resortwear</p>
        <p>Casual</p>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-title" onclick="loadProducts()">ALL PRODUCTS</div>
    </div>
  </div>

  <!-- Wadah Produk Firestore -->
  <div id="product-container" class="product-grid">
    <p style="text-align:center; padding:20px;">Loading produk...</p>
  </div>

  <!-- Modal Pop-Up Gambar dengan Fitur Zoom -->
  <div id="imageModal" class="image-modal">
    <span class="close-modal" onclick="closeImageModal()">&times;</span>
    <div class="modal-content-wrapper">
      <img class="modal-content" id="imgFull" alt="Product Preview" onclick="toggleZoomImg()">
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomIn()">Zoom +</button>
      <button class="zoom-btn" onclick="zoomOut()">Zoom -</button>
      <button class="zoom-btn" onclick="resetZoom()">Reset</button>
    </div>
  </div>

  <!-- Modal Checkout -->
  <div id="checkoutModal" style="display:none; position:fixed; z-index:1002; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
    <div style="background:#222; padding:20px; border-radius:10px; width:90%; max-width:400px; color:#fff;">
      <h3 style="color:#d4af37; margin-top:0;">Checkout Order</h3>

      <input id="nama" placeholder="Nama Anda" style="width:100%; padding:10px; margin-top:10px; box-sizing:border-box; background:#333; color:#fff; border:1px solid #444; border-radius:5px;">
      <textarea id="alamat" placeholder="Alamat Lengkap" style="width:100%; padding:10px; margin-top:10px; box-sizing:border-box; background:#333; color:#fff; border:1px solid #444; border-radius:5px; height:80px;"></textarea>

      <p id="produkDipilih" style="margin-top:15px; font-weight:bold;"></p>
      <p id="totalHarga" style="color:#d4af37; font-weight:bold; font-size:1.1em;"></p>

      <button onclick="kirimWA()" style="width:100%; padding:12px; margin-top:10px; background:#d4af37; border:none; cursor:pointer; font-weight:bold; border-radius:5px; color:#111;">
        Kirim ke WhatsApp
      </button>

      <button onclick="closeCheckout()" style="width:100%; padding:10px; margin-top:8px; background:#555; border:none; color:white; cursor:pointer; border-radius:5px;">
        Batal
      </button>
    </div>
  </div>

  <!-- Firebase JavaScript SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBNlsnzbMHKq9gKWe-EvYgrzwohxXLAOs",
      authDomain: "mutumanikam-store.firebaseapp.com",
      projectId: "mutumanikam-store",
      storageBucket: "mutumanikam-store.firebasestorage.app",
      messagingSenderId: "28963833581",
      appId: "1:28963833581:web:1a8001fec139a7ace1abe4"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();

    // Variable global checkout
    let selectedProduct = "";
    let selectedPrice = 0;
    let selectedQty = 1;

    // 🔥 LOAD PRODUK DARI FIRESTORE
    function loadProducts(categoryFilter = null) {
      const container = document.getElementById("product-container");
      container.innerHTML = "<p style='text-align:center;padding:20px'>Loading produk...</p>";

      let query = db.collection("Products");

      if (categoryFilter) {
        query = query.where("category", "==", categoryFilter);
      }

      query.get().then(snapshot => {
        let html = "";

        if (snapshot.empty) {
          html = "<p style='text-align:center;padding:20px'>Produk belum tersedia</p>";
        } else {
          snapshot.forEach(doc => {
            const p = doc.data();

            let nama = (p.name || "Produk").replace(/[`'"]/g, "");
            let harga = Number(p.price) || 0;
            let kategori = p.category || "Umum";
            let img = p.image ? p.image.trim() : "https://via.placeholder.com/200";

            html += `
              <div class="product-card">
                <img src="${img}" 
                     onclick="openImageModal('${img}')"
                     onerror="this.src='https://via.placeholder.com/200'">

                <h3>${nama}</h3>
                <p class="category">${kategori}</p>
                <p class="price">Rp ${harga.toLocaleString('id-ID')}</p>

                <div class="qty-box">
                  <button onclick="changeQty(this, -1)">-</button>
                  <span class="qty">1</span>
                  <button onclick="changeQty(this, 1)">+</button>
                </div>

                <button class="buy-btn" onclick="openCheckout(this, '${nama}', ${harga})">
                  Beli via WA
                </button>
              </div>
            `;
          });
        }

        container.innerHTML = html;

      }).catch(err => {
        console.error("Firestore error:", err);
        container.innerHTML = "<p style='text-align:center;color:red;'>Gagal memuat produk. Periksa Firestore rules atau koneksi internet.</p>";
      });
    }

    // 🔥 KONTROL JUMLAH (QTY)
    function changeQty(btn, change) {
      let el = btn.parentElement.querySelector(".qty");
      let val = parseInt(el.innerText) || 1;
      val += change;
      if (val < 1) val = 1;
      el.innerText = val;
    }

    // 🔥 CHECKOUT & WA
    function openCheckout(btn, productName, price) {
      let card = btn.closest(".product-card");
      let qty = parseInt(card.querySelector(".qty").innerText) || 1;

      selectedProduct = productName;
      selectedPrice = price;
      selectedQty = qty;

      let total = price * qty;

      document.getElementById("produkDipilih").innerText =
        "Produk: " + productName + " (" + qty + " pcs)";

      document.getElementById("totalHarga").innerText =
        "Total: Rp " + total.toLocaleString('id-ID');

      document.getElementById("checkoutModal").style.display = "flex";
    }

    function closeCheckout() {
      document.getElementById("checkoutModal").style.display = "none";
      document.getElementById("nama").value = "";
      document.getElementById("alamat").value = "";
    }

    document.getElementById("checkoutModal").addEventListener("click", function(e) {
      if (e.target === this) {
        closeCheckout();
      }
    });

    function kirimWA() {
      let nama = document.getElementById("nama").value.trim();
      let alamat = document.getElementById("alamat").value.trim();

      if (!nama || !alamat) {
        alert("Nama & alamat wajib diisi!");
        return;
      }

      let total = selectedPrice * selectedQty;
      let phone = "6281353885122";

      let pesan = Halo Admin Mutumanikam 👋\n\nSaya mau order:\n🛍️ Produk: ${selectedProduct}\n📦 Jumlah: ${selectedQty} pcs\n💰 Total: Rp ${total.toLocaleString('id-ID')}\n\n👤 Nama: ${nama}\n📍 Alamat: ${alamat}\n\nMohon konfirmasi ya 🙏;

      let url = https://wa.me/${phone}?text=${encodeURIComponent(pesan)};

      window.open(url, "_blank");
      closeCheckout();
    }

    // 🔥 MODAL GAMBAR & ZOOM
    let zoomScale = 1;

    function openImageModal(src) {
      const modal = document.getElementById("imageModal");
      const img = document.getElementById("imgFull");
      modal.style.display = "flex";
      img.src = src;
      resetZoom();
    }

    function closeImageModal() {
      document.getElementById("imageModal").style.display = "none";
      resetZoom();
    }

    function toggleZoomImg() {
      zoomScale = zoomScale === 1 ? 2 : 1;
      document.getElementById("imgFull").style.transform = scale(${zoomScale});
    }

    function zoomIn() {
      zoomScale += 0.3;
      document.getElementById("imgFull").style.transform = scale(${zoomScale});
    }

    function zoomOut() {
      zoomScale = Math.max(1, zoomScale - 0.3);
      document.getElementById("imgFull").style.transform = scale(${zoomScale});
    }

    function resetZoom() {
      zoomScale = 1;
      document.getElementById("imgFull").style.transform = "scale(1)";
    }

    // 🔥 SIDEBAR & KATEGORI
    function toggleMenu() {
      document.getElementById("mobileMenu").classList.toggle("active");
      document.getElementById("overlay").classList.toggle("active");
    }

    function toggleSub(el) {
      const parent = el.parentElement;
      document.querySelectorAll(".menu-section").forEach(i => {
        if (i !== parent) i.classList.remove("active");
      });
      parent.classList.toggle("active");
    }

    function filterCategory(cat) {
      loadProducts(cat);
      toggleMenu();
    }

    // 🔥 LOAD AWAL
    window.addEventListener("DOMContentLoaded", () => {
      loadProducts();
    });
  </script>
</body>
</html>
